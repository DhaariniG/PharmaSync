<section class="card form-panel-card">
    <div class="panel-header">
        <h3>Security & Password</h3>
        <p>Update your access credentials and check authentication tracking protocols.</p>
    </div>

    <div class="form-row-grid fields-single-col">
        <div class="form-group">
            <label>Current Password</label>
            <input type="password" name="current_password" placeholder="••••••••••••" class="form-control">
        </div>
        <div class="form-group">
            <label>New Password</label>
            <input type="password" name="new_password" placeholder="Enter new password" class="form-control">
        </div>
        <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" name="confirm_password" placeholder="Verify new password" class="form-control">
        </div>
    </div>
</section>
